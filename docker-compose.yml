name: readinglasses

services:
  # db:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRESS_USER: myuser
  #     POSTGRESS_PASSWORD: mypassword
  #     POSTGRESS_DB: mydatabase
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgress_data:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - libretranslate_data:/home/libretranslate/.local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    # environment:
      # DATABSE_URL: "postgresql://myuser:mypassword@db:5432/mydatabase?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      - libretranslate
    #   - db
    volumes:
      - ./backend:/backend
      - backend_node_modules:/backend/node_modules
      
    env_file:
      - /backend/.env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    
    environment:
      - EXPO_PACKAGER_PROXY_URL=http://10.1.1.125:8081

    tty: true
    stdin_open: true
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
  libretranslate_data:
