name: readinglasses

services:
  # db:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRESS_USER: myuser
  #     POSTGRESS_PASSWORD: mypassword
  #     POSTGRESS_DB: mydatabase
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgress_data:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Optional: Keep translation models cached on your host machine so they don't re-download on restart
    volumes:
      - libretranslate_data:/home/libretranslate/.local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    # environment:
      # DATABSE_URL: "postgresql://myuser:mypassword@db:5432/mydatabase?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      - libretranslate
    #   - db
    volumes:
      - ./backend:/app
      - /app/node_modules
      
    env_file:
      - /backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  libretranslate_data:
